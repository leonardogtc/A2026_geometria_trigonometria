<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" style="background:#0f172a; font-family:sans-serif;">
  <defs>
    <!-- Marcadores de seta -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Grade de fundo sutil -->
  <line x1="0" y1="300" x2="600" y2="300" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="300" y1="600" x2="300" y2="0" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Rótulos dos eixos -->
  <text x="575" y="290" fill="#94a3b8" font-size="14">X</text>
  <text x="310" y="25" fill="#94a3b8" font-size="14">Y</text>

  <!-- Círculo Unitário -->
  <circle cx="300" cy="300" r="180" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Linha da Tangente (x = raio) -->
  <line x1="480" y1="30" x2="480" y2="570" stroke="#475569" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Segmento Cosseno (Azul Claro) -->
  <line x1="300" y1="300" x2="415.7017697435771" y2="300" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Segmento Seno (Verde Esmeralda) -->
  <line x1="415.7017697435771" y1="300" x2="415.7017697435771" y2="162.11200023858396" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>

  <!-- Raio / Hipotenusa (Branco / Ângulo) -->
  <line x1="300" y1="300" x2="415.7017697435771" y2="162.11200023858396" stroke="#f8fafc" stroke-width="2.5" />

  <!-- Segmento Tangente (Laranja) se estiver dentro de limites visíveis -->
  
    <line x1="300" y1="300" x2="480" y2="85.48435333304221" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="4 2"/>
    <line x1="480" y1="300" x2="480" y2="85.48435333304221" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
    <circle cx="480" cy="85.48435333304221" r="4" fill="#fb923c" />
    <text x="490" y="192.74217666652112" fill="#fb923c" font-size="13" font-weight="bold">tan(θ) = 1.19</text>
  

  <!-- Ponto P(cos θ, sin θ) -->
  <circle cx="415.7017697435771" cy="162.11200023858396" r="6" fill="#f43f5e" />

  <!-- Arco do Ângulo θ -->
  <path d="M 340 300 A 40 40 0 0 0 325.71150438746156 269.3582222752409" fill="none" stroke="#eab308" stroke-width="2.5" />
  <text x="350" y="285" fill="#eab308" font-size="14" font-weight="bold">θ = 50°</text>

  <!-- Legendas e Valores -->
  <rect x="20" y="20" width="220" height="130" rx="8" fill="#1e293b" opacity="0.9" />
  <text x="35" y="45" fill="#f8fafc" font-size="14" font-weight="bold">Relações Trigonométricas</text>
  <text x="35" y="70" fill="#38bdf8" font-size="13">• cos(θ) = 0.643 (base x)</text>
  <text x="35" y="95" fill="#34d399" font-size="13">• sin(θ) = 0.766 (altura y)</text>
  <text x="35" y="120" fill="#fb923c" font-size="13">• tan(θ) = 1.192 (sin / cos)</text>
  <text x="35" y="140" fill="#94a3b8" font-size="11">cos²(θ) + sin²(θ) = 1.000</text>
</svg>