<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" style="background:#090d16; font-family:sans-serif;">
  <defs>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <!-- Círculos de referência trigonométrica (Raio Externo e Interno) -->
  <circle cx="250" cy="250" r="170" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="250" cy="250" r="70" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Linhas radiais até os vértices -->
  <line x1="250" y1="250" x2="250.00" y2="80.00" stroke="#1e293b" stroke-width="1" />
  <line x1="250" y1="250" x2="285.00" y2="189.38" stroke="#1e293b" stroke-width="1" />
  <line x1="250" y1="250" x2="397.22" y2="165.00" stroke="#1e293b" stroke-width="1" />
  <line x1="250" y1="250" x2="320.00" y2="250.00" stroke="#1e293b" stroke-width="1" />
  <line x1="250" y1="250" x2="397.22" y2="335.00" stroke="#1e293b" stroke-width="1" />
  <line x1="250" y1="250" x2="285.00" y2="310.62" stroke="#1e293b" stroke-width="1" />
  <line x1="250" y1="250" x2="250.00" y2="420.00" stroke="#1e293b" stroke-width="1" />
  <line x1="250" y1="250" x2="215.00" y2="310.62" stroke="#1e293b" stroke-width="1" />
  <line x1="250" y1="250" x2="102.78" y2="335.00" stroke="#1e293b" stroke-width="1" />
  <line x1="250" y1="250" x2="180.00" y2="250.00" stroke="#1e293b" stroke-width="1" />
  <line x1="250" y1="250" x2="102.78" y2="165.00" stroke="#1e293b" stroke-width="1" />
  <line x1="250" y1="250" x2="215.00" y2="189.38" stroke="#1e293b" stroke-width="1" />

  <!-- Estrela Gerada -->
  <polygon points="250.00,80.00 285.00,189.38 397.22,165.00 320.00,250.00 397.22,335.00 285.00,310.62 250.00,420.00 215.00,310.62 102.78,335.00 180.00,250.00 102.78,165.00 215.00,189.38" fill="url(#starGrad)" fill-opacity="0.25" stroke="url(#starGrad)" stroke-width="3" stroke-linejoin="round"/>

  <!-- Vértices -->
  <circle cx="250.00" cy="80.00" r="4" fill="#38bdf8"/>
  <circle cx="285.00" cy="189.38" r="4" fill="#38bdf8"/>
  <circle cx="397.22" cy="165.00" r="4" fill="#38bdf8"/>
  <circle cx="320.00" cy="250.00" r="4" fill="#38bdf8"/>
  <circle cx="397.22" cy="335.00" r="4" fill="#38bdf8"/>
  <circle cx="285.00" cy="310.62" r="4" fill="#38bdf8"/>
  <circle cx="250.00" cy="420.00" r="4" fill="#38bdf8"/>
  <circle cx="215.00" cy="310.62" r="4" fill="#38bdf8"/>
  <circle cx="102.78" cy="335.00" r="4" fill="#38bdf8"/>
  <circle cx="180.00" cy="250.00" r="4" fill="#38bdf8"/>
  <circle cx="102.78" cy="165.00" r="4" fill="#38bdf8"/>
  <circle cx="215.00" cy="189.38" r="4" fill="#38bdf8"/>

  <!-- Título -->
  <text x="20" y="35" fill="#f8fafc" font-size="15" font-weight="bold">Estrela Regular (6 pontas)</text>
  <text x="20" y="55" fill="#94a3b8" font-size="12">x = cx + r · cos(θ), y = cy + r · sin(θ)</text>
</svg>